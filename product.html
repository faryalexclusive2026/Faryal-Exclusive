    { key: 'mehndi', hex: '#6b8e23', weight: 8 },
    { key: 'olive', hex: '#6b705c', weight: 8 },
    { key: 'mint', hex: '#98f5c8', weight: 8 },
    { key: 'lilac', hex: '#c8a2c8', weight: 8 },
    { key: 'lavender', hex: '#dcd6f7', weight: 8 },
    { key: 'purple', hex: '#7b2cbf', weight: 7 },
    { key: 'navy', hex: '#102a54', weight: 8 },
    { key: 'ice', hex: '#cce7f5', weight: 7 },
    { key: 'powder', hex: '#b8d8eb', weight: 7 },
    { key: 'sky', hex: '#8ecae6', weight: 7 },
    { key: 'blue', hex: '#2563eb', weight: 6 },
    { key: 'green', hex: '#1e7f43', weight: 6 },
    { key: 'gold', hex: '#d4af37', weight: 7 },
    { key: 'yellow', hex: '#f4c430', weight: 6 },
    { key: 'rust', hex: '#b7410e', weight: 7 },
    { key: 'orange', hex: '#f77f00', weight: 6 },
    { key: 'brown', hex: '#6f4e37', weight: 6 },
    { key: 'charcoal', hex: '#36454f', weight: 7 },
    { key: 'grey', hex: '#808080', weight: 6 },
    { key: 'gray', hex: '#808080', weight: 6 },
    { key: 'black', hex: '#111111', weight: 6 },
    { key: 'white', hex: '#ffffff', weight: 5 }
  ].sort((a, b) => b.weight - a.weight);

  for (const rule of keywordRules) {
    if (clean.includes(rule.key)) {
      return rule.hex;
    }
  }

  let hash = 0;
  for (let i = 0; i < clean.length; i++) {
    hash = clean.charCodeAt(i) + ((hash << 5) - hash);
  }
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue}, 45%, 65%)`;
}

async function loadProductFromSupabase(productId) {
  const { data, error } = await supabaseClient
    .from('products')
    .select('*')
    .eq('id', productId)
    .single();

  if (error || !data) {
    console.error("Fetch Error:", error);
    document.getElementById('productContainer').innerHTML = '<p style="text-align:center; width:100%;">Product not found or failed to load.</p>';
    return;
  }

  currentProduct = data;
  if (currentProduct.keywords) {
    let metaKeywordTag = document.querySelector('meta[name="keywords"]');
    if (!metaKeywordTag) {
      metaKeywordTag = document.createElement('meta');
      metaKeywordTag.name = 'keywords';
      document.head.appendChild(metaKeywordTag);
    }
    metaKeywordTag.content = currentProduct.keywords;
  }

  galleryImages = [];
  const paths = Array.isArray(data.images) ? data.images : [];

  for (const path of paths) {
    if (!path) continue;
    let cleanPath = path.toString().trim().replace(/^\/+/, '');
    if (cleanPath.toLowerCase().startsWith('product/')) {
      cleanPath = cleanPath.substring(8);
    }

    const { data: publicData } = supabaseClient
      .storage
      .from("Product")
      .getPublicUrl(cleanPath);

    if (publicData && publicData.publicUrl) {
      galleryImages.push(publicData.publicUrl);
    }
  }

  if (galleryImages.length === 0 && data.image_url) {
    galleryImages.push(data.image_url);
  }

  updateProductSEO(currentProduct, galleryImages);

renderProduct(currentProduct);
loadRelatedProducts(currentProduct);
}

function updateProductSEO(prod, images = []) {
  const productName = (prod.name || "Pakistani Fashion").trim();
  const brand = (prod.brand || "Faryal Exclusive").trim();
  const description = (
    prod.description ||
    `${productName} – Shop Pakistani fashion online at Faryal Exclusive.`
  ).trim();

  const price = Number(prod.price);
  const productUrl =
    window.location.origin +
    window.location.pathname +
    "?id=" + encodeURIComponent(prod.id);

  const imageList = images.filter(Boolean);

  // Browser title
  document.title = `${productName} | ${brand} | Faryal Exclusive`;

  // Meta description
  let metaDescription = document.querySelector('meta[name="description"]');
  if (!metaDescription) {
    metaDescription = document.createElement("meta");
    metaDescription.name = "description";
    document.head.appendChild(metaDescription);
  }
  metaDescription.content = description.slice(0, 160);

  // Canonical URL
  let canonical = document.querySelector('link[rel="canonical"]');
  if (!canonical) {
    canonical = document.createElement("link");
    canonical.rel = "canonical";
    document.head.appendChild(canonical);
  }
  canonical.href = productUrl;

  // Open Graph information
  function setMeta(property, content) {
    let tag = document.querySelector(`meta[property="${property}"]`);
    if (!tag) {
      tag = document.createElement("meta");
      tag.setAttribute("property", property);
      document.head.appendChild(tag);
    }
    tag.content = content;
  }

  setMeta("og:title", document.title);
  setMeta("og:description", description.slice(0, 160));
  setMeta("og:url", productUrl);

  if (imageList.length) {
    setMeta("og:image", imageList[0]);
  }

  // Product Schema
  const productSchema = {
    "@context": "https://schema.org",
    "@type": "Product",
    "name": productName,
    "description": description,
    "url": productUrl,
    "brand": {
      "@type": "Brand",
      "name": brand
    },
    "image": imageList
  };

  if (price > 0 && Number.isFinite(price)) {
    const offer = {
      "@type": "Offer",
      "url": productUrl,
      "priceCurrency": "PKR",
      "price": price
    };

    const stock = (prod.stock || "").trim().toLowerCase();

    if (stock === "available") {
      offer.availability = "https://schema.org/InStock";
    } else if (stock === "limited stock") {
      offer.availability = "https://schema.org/LimitedAvailability";
    } else if (stock === "out of stock") {
      offer.availability = "https://schema.org/OutOfStock";
    }

    productSchema.offers = offer;
  }

  let schemaTag = document.getElementById("product-jsonld");
  if (!schemaTag) {
    schemaTag = document.createElement("script");
    schemaTag.type = "application/ld+json";
    schemaTag.id = "product-jsonld";
    document.head.appendChild(schemaTag);
  }

  schemaTag.textContent = JSON.stringify(productSchema);
}

async function loadRelatedProducts(prod) {
  const relatedGrid = document.getElementById("related-products-grid");
  const relatedSection = document.getElementById("related-products-section");
  if (!relatedGrid || !relatedSection) return;

  const currentCategory = (prod.category || "").trim().toLowerCase();
  const currentCollection = (prod.collection || "").trim().toLowerCase();
  const currentSubcategory = (prod.subcategory || "").trim().toLowerCase();

  if (!currentCategory) {
    relatedSection.style.display = "none";
    return;
  }

  const { data: matched, error } = await supabaseClient
    .from('products')
    .select('*')
    .neq('id', prod.id)
    .ilike('category', prod.category.trim());

  if (error || !matched || matched.length === 0) {
    relatedSection.style.display = "none";
    return;
  }

  const sameCategoryItems = matched.filter(
    p => (p.category || "").trim().toLowerCase() === currentCategory
  );

  const exactCategoryAndCollection = sameCategoryItems.filter(
    p => currentCollection && (p.collection || "").trim().toLowerCase() === currentCollection
  );

  const otherInSameCategory = sameCategoryItems.filter(
    p => !(currentCollection && (p.collection || "").trim().toLowerCase() === currentCollection)
  );

  const sortGroup = (list) => [...list].sort((a, b) => {
    const aSub = currentSubcategory && (a.subcategory || "").trim().toLowerCase() === currentSubcategory ? 1 : 0;
    const bSub = currentSubcategory && (b.subcategory || "").trim().toLowerCase() === currentSubcategory ? 1 : 0;
    if (aSub !== bSub) return bSub - aSub;

    const aPin = a.is_pinned ? 1 : 0;
    const bPin = b.is_pinned ? 1 : 0;
    if (aPin !== bPin) return bPin - aPin;

    return Number(b.id || 0) - Number(a.id || 0);
  });

  const orderedRelated = [
    ...sortGroup(exactCategoryAndCollection),
    ...sortGroup(otherInSameCategory)
  ];

  const displayList = orderedRelated.slice(0, 4);

  if (!displayList.length) {
    relatedSection.style.display = "none";
    return;
  }

  relatedSection.style.display = "block";

  relatedGrid.innerHTML = displayList.map(p => {
    let imgUrl = 'https://via.placeholder.com/300';
    try {
      let imgs = p.images;
      if (typeof imgs === 'string') {
        try { imgs = JSON.parse(imgs); } catch (e) { imgs = [imgs]; }
      }
      const imgsArr = Array.isArray(imgs) ? imgs : [];
      if (imgsArr.length > 0 && imgsArr[0]) {
        let cleanP = imgsArr[0].toString().trim().replace(/^\/+/, '');
        if (cleanP.toLowerCase().startsWith('product/')) cleanP = cleanP.substring(8);
        const pub = supabaseClient.storage.from("Product").getPublicUrl(cleanP);
        if (pub && pub.data) imgUrl = pub.data.publicUrl;
      } else if (p.image_url) {
        imgUrl = p.image_url;
      }
    } catch (e) {}

    return `
      <article class="product" onclick="window.location.href='product.html?id=${p.id}'" style="cursor: pointer; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
        <div class="product-image" style="height: 280px; overflow: hidden; background: #fdfaf5;">
          <img src="${imgUrl}" alt="${safeText(p.name)}" loading="lazy" style="width: 100%; height: 100%; object-fit: cover; object-position: top center;">
        </div>
        <div class="product-info" style="padding: 12px; text-align: center;">
          <h3 style="font-size: 13px; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #13110e;">${safeText(p.name)}</h3>
          <div class="price" style="font-size: 13px; font-weight: bold; color: #8b4357;">Rs. ${Number(p.price || 0).toLocaleString("en-PK")}</div>
        </div>
      </article>
    `;
  }).join("");
}

async function compressReviewImageTo150KB(file, maxKB = 150) {
  const maxBytes = maxKB * 1024;
  if (!file) return null;

  if (file.size <= maxBytes && file.type && file.type.startsWith("image/")) {
    return file;
  }

  const img = await new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const i = new Image();
    i.onload = () => {
      URL.revokeObjectURL(url);
      resolve(i);
    };
    i.onerror = (err) => {
      URL.revokeObjectURL(url);
      reject(err);
    };
    i.src = url;
  });

  const maxDimension = 1280;
  let targetW = img.width || 800;
  let targetH = img.height || 800;

  if (targetW > maxDimension || targetH > maxDimension) {
    if (targetW >= targetH) {
      targetH = Math.round((targetH * maxDimension) / targetW);
      targetW = maxDimension;
    } else {
      targetW = Math.round((targetW * maxDimension) / targetH);
      targetH = maxDimension;
    }
  }

  let bestBlob = null;

  for (let scalePass = 0; scalePass < 4; scalePass++) {
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(200, targetW);
    canvas.height = Math.max(200, targetH);
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

    let quality = 0.82;
    for (let step = 0; step < 8; step++) {
      const blob = await new Promise((resolve) =>
        canvas.toBlob(resolve, "image/jpeg", quality)
      );
      if (blob) {
        bestBlob = blob;
        if (blob.size <= maxBytes) {
          return blob;
        }
      }
      quality = Math.max(0.2, Number((quality - 0.1).toFixed(2)));
    }

    targetW = Math.round(targetW * 0.8);
    targetH = Math.round(targetH * 0.8);
  }

  return bestBlob || file;
}

async function handleReviewPhotosChange() {
  const p1 = document.getElementById("reviewPhoto1");
  const p2 = document.getElementById("reviewPhoto2");
  const previewBox = document.getElementById("reviewPhotosPreview");

  const chosen = [];
  if (p1 && p1.files && p1.files[0]) chosen.push(p1.files[0]);
  if (p2 && p2.files && p2.files[0]) chosen.push(p2.files[0]);

  const limited = chosen.slice(0, 2);
  const compressedList = [];

  for (const file of limited) {
    try {
      const compressed = await compressReviewImageTo150KB(file, 150);
      compressedList.push(compressed || file);
    } catch (e) {
      compressedList.push(file);
    }
  }

  reviewImageFiles = compressedList;

  if (previewBox) {
    previewBox.innerHTML = reviewImageFiles.map((item) => {
      const tempUrl = URL.createObjectURL(item);
      return `<img src="${tempUrl}" alt="Review preview" style="width:64px; height:80px; object-fit:cover; border-radius:6px; border:1px solid #ddd;">`;
    }).join("");
  }
}

async function uploadReviewImages(productId) {
  const uploadedUrls = [];
  const bucketName = "Product";

  for (let i = 0; i < Math.min(reviewImageFiles.length, 2); i++) {
    let file = reviewImageFiles[i];
    if (!file) continue;

    if ((file.size || 0) > 150 * 1024) {
      try {
        file = (await compressReviewImageTo150KB(file, 150)) || file;
      } catch (e) {}
    }

    const safeName = (file.name || `review_${i + 1}`)
      .replace(/\.[^/.]+$/, "")
      .replace(/[^\w.-]/g, "_");
    const ext = file.type === "image/png" ? ".png" : file.type === "image/webp" ? ".webp" : ".jpg";
    const storagePath = `reviews/${productId}/${Date.now()}-${i + 1}-${safeName}${ext}`;

    const { data, error } = await supabaseClient
      .storage
      .from(bucketName)
      .upload(storagePath, file, {
        contentType: file.type || "image/jpeg",
        upsert: false
      });

    if (!error && data && data.path) {
      const { data: pubData } = supabaseClient
        .storage
        .from(bucketName)
        .getPublicUrl(data.path);

      if (pubData && pubData.publicUrl) {
        uploadedUrls.push(pubData.publicUrl);
      }
    }
  }

  return uploadedUrls;
}

    .from("reviews")

  document.getElementById("avgRatingNumber").textContent = avgRating;

      } catch (e) {

    }

    const reviewImgsHtml = imgs.length > 0
      ? `<div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;">
          ${imgs.map((imgUrl) => `
            <img src="${safeText(imgUrl)}" alt="Customer review photo" onclick="openReviewPhotoModal('${safeText(imgUrl)}')" style="width:72px; height:90px; object-fit:cover; border-radius:6px; border:1px solid #e2d8c5; cursor:pointer;">
          `).join("")}
         </div>`
      : "";

    return `
      <div style="border-top: 1px solid #e7dcc8; padding: 18px 0;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <div style="color: #f7a80c; font-size: 14px; letter-spacing: 2px;">${"★".repeat(rCount)}${"☆".repeat(5 - rCount)}</div>
          <span style="color: #999; font-size: 11px;">${new Date(r.created_at).toLocaleDateString()}</span>
        </div>
        <h4 style="margin: 0 0 4px 0; font-size: 14px; color: #111;">${safeText(r.user_name)} <span style="font-size: 10px; color: #2e7d32; background: #e8f5e9; padding: 2px 6px; border-radius: 2px; margin-left: 6px;">Verified Buyer</span></h4>
        <p style="margin: 0; font-size: 13px; color: #555; line-height: 1.5;">${safeText(r.comment)}</p>
        ${reviewImgsHtml}
      </div>
    `;
  }).join("");
}

function openReviewPhotoModal(imgUrl) {
  const modal = document.getElementById("imageModal");
  const modalImg = document.getElementById("modalImage");
  if (modal && modalImg && imgUrl) {
    modal.style.display = "flex";
    modalImg.src = imgUrl;
  }
}

async function submitReview(event) {
  event.preventDefault();
  const productId = getProductIdFromUrl();
  const name = document.getElementById("reviewerName").value.trim();
  const comment = document.getElementById("reviewText").value.trim();

  if (!selectedRating) {
    alert("Please select a star rating!");
    return;
  }

  if (!productId) {
    alert("Product ID missing!");
    return;
  }

  const uploadedImageUrls = await uploadReviewImages(productId);

  const payloadWithImages = {
    product_id: productId,
    user_name: name,
    rating: selectedRating,
    comment: comment,
    images: uploadedImageUrls
  };

  let { error } = await supabaseClient
    .from("reviews")
    .insert([payloadWithImages]);

  if (error && /column.*images/i.test(error.message || "")) {
    const fallbackRes = await supabaseClient
      .from("reviews")
      .insert([{
        product_id: productId,
        user_name: name,
        rating: selectedRating,
        comment: comment
      }]);
    error = fallbackRes.error;
  }

  if (error) {
    alert("Failed to submit review. Please try again.");
    return;
  }

  alert("Thank you! Your review has been submitted.");
  document.getElementById("reviewForm").reset();
  const p1 = document.getElementById("reviewPhoto1");
  const p2 = document.getElementById("reviewPhoto2");
  const previewBox = document.getElementById("reviewPhotosPreview");
  if (p1) p1.value = "";
  if (p2) p2.value = "";
  if (previewBox) previewBox.innerHTML = "";
  reviewImageFiles = [];
  setRating(0);
  toggleReviewForm();
  loadReviews();
}
function safeText(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

window.addEventListener("DOMContentLoaded", () => {
  updateCartCount();
  fetchProductDetails();
  loadReviews();
});
</script>
